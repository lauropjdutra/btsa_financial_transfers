services:
  postgres:
    image: postgres:17-alpine
    container_name: btsa-transfers-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: btsa_financial_transfers
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: btsa-transfers-api
    ports:
      - "5251:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=btsa_financial_transfers;Username=postgres;Password=postgrespassword"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
